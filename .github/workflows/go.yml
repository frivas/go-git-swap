name: Go

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
      - run: make vuln

  security:
    uses: frivas/.github/.github/workflows/security.yml@v1
    with:
      codeql-languages: '["go", "actions"]'

  # Builds every release binary on each run, so a broken target shows up in PRs.
  build:
    needs: [test, lint, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make checksums
      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: bin/

  # On a v* tag: the shared release gates on the security report, writes the notes
  # and attaches the binaries, SHA256SUMS, the SBOM and every scan report.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    permissions:
      contents: write
    uses: frivas/.github/.github/workflows/release.yml@v1
    with:
      tag: ${{ github.ref_name }}
      codeql-languages: '["go", "actions"]'
      dist-artifact: binaries
      gate: Tests with the race detector on Linux, macOS and Windows, golangci-lint and govulncheck passed on this commit.
