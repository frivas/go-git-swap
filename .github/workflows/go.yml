name: Go

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make build
      - run: make test
      - uses: golangci/golangci-lint-action@v9
        if: matrix.os == 'ubuntu-latest'
        with:
          version: v2.15
      - uses: golang/govulncheck-action@v1
        if: matrix.os == 'ubuntu-latest'
        with:
          go-version-file: go.mod

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make build-all
      - uses: softprops/action-gh-release@v3
        with:
          files: bin/go-git-swap-*
          generate_release_notes: true
